<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  body { margin: 0; background: #FFFFFF; font-family: 'Montserrat', system-ui, sans-serif; }
  body, button, input, select, textarea { font-family: 'Montserrat', system-ui, sans-serif; }
  h1, h2, h3, h4 { font-family: 'Montserrat', system-ui, sans-serif; font-weight: 900; }
  .material-icons { font-family: 'Material Icons'; }
  .material-symbols-outlined, .ms { font-family: 'Material Symbols Outlined'; }
  a { color: #059669; text-decoration: none; }
  a:hover { color: #047857; text-decoration: underline; }
  .ms { font-family: 'Material Symbols Outlined'; font-weight: normal; line-height: 1; }
</style>

<div style="padding: 40px 48px 64px; display: flex; flex-direction: column; gap: 24px; color: #0F172A;">
  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #94A3B8;">Bora · Navigation</div>
    <h1 style="margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -0.02em;">BottomToolbar</h1>
    <p style="margin: 0; font-size: 13px; font-weight: 500; color: #64748B;">Contextual actions for a multi-row selection.</p>
  </div>

  <div style="box-sizing: border-box; background: #0F172A; border-radius: 9999px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); padding: 10px 12px 10px 20px; display: inline-flex; align-items: center; gap: 18px; align-self: flex-start;">
    <span style="font-size: 13px; font-weight: 700; color: #FFFFFF;">3 selected</span>
    <div style="display: flex; align-items: center; gap: 6px;">
      <span style="height: 34px; padding: 0 14px; border-radius: 9999px; background: rgba(255,255,255,0.12); color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px;"><span class="ms" style="font-size: 17px;">swap_horiz</span>Move</span>
      <span style="height: 34px; padding: 0 14px; border-radius: 9999px; background: rgba(255,255,255,0.12); color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px;"><span class="ms" style="font-size: 17px;">person_add</span>Assign</span>
      <span style="height: 34px; padding: 0 14px; border-radius: 9999px; background: #EF4444; color: #FFFFFF; font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 6px;"><span class="ms" style="font-size: 17px;">delete</span>Delete</span>
    </div>
  </div>

  <div style="box-sizing: border-box; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 9999px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.10), 0 2px 4px -1px rgba(0,0,0,0.06); padding: 10px 12px 10px 20px; display: inline-flex; align-items: center; gap: 18px; align-self: flex-start;">
    <span style="font-size: 13px; font-weight: 700; color: #0F172A;">Pipeline</span>
    <div style="display: flex; align-items: center; gap: 6px;">
      <span class="ms" style="width: 34px; height: 34px; border-radius: 9999px; background: #F1F5F9; display: flex; align-items: center; justify-content: center; font-size: 19px; color: #475569;">filter_list</span>
      <span class="ms" style="width: 34px; height: 34px; border-radius: 9999px; background: #F1F5F9; display: flex; align-items: center; justify-content: center; font-size: 19px; color: #475569;">sort</span>
      <span class="ms" style="width: 34px; height: 34px; border-radius: 9999px; background: #F1F5F9; display: flex; align-items: center; justify-content: center; font-size: 19px; color: #475569;">download</span>
      <span style="height: 34px; padding: 0 16px; border-radius: 9999px; background: #10B981; color: #FFFFFF; font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 6px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 2px 8px -1px rgba(16,185,129,0.6);"><span class="ms" style="font-size: 17px;">add</span>New lead</span>
    </div>
  </div>
